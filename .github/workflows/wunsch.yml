name: Aktienwunsch

# Ein Issue mit dem Titel "Aktienwunsch: Mercedes" fügt die passende Aktie zur Watchlist hinzu
# und startet danach die Analyse. Nur Issues des Repo-Besitzers werden bearbeitet.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: wunsch
  cancel-in-progress: false

jobs:
  wunsch:
    if: startsWith(github.event.issue.title, 'Aktienwunsch') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Aktie suchen und eintragen
        env:
          WUNSCH_TITEL: ${{ github.event.issue.title }}
          WUNSCH_TEXT: ${{ github.event.issue.body }}
          WUNSCH_ISSUE: ${{ github.event.issue.number }}
        run: python -m analyzer.wunsch
      - name: Speichern
        run: |
          git config user.name "elliott-bot"
          git config user.email "elliott-bot@users.noreply.github.com"
          git add watchlist.csv docs/wuensche.json
          git diff --cached --quiet || git commit -m "Aktienwunsch #${{ github.event.issue.number }}"
          git pull --rebase -X theirs || true
          git push
      - name: Antworten und Analyse starten
        env:
          GH_TOKEN: ${{ github.token }}
          NR: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NR" --body-file wunsch_antwort.md
          gh issue close "$NR"
          if [ "$(cat wunsch_neu.txt)" = "ja" ]; then
            gh workflow run analyse.yml -f modus=schnell
          fi
