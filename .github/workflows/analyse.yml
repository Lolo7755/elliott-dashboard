name: Elliott-Analyse

on:
  schedule:
    # Schnell-Lauf kurz nach US-Börsenschluss (22:00 Uhr deutscher Zeit), Ergebnis nach ca. 5 Minuten.
    # Zwei Zeiten wegen Sommer-/Winterzeit: der Lauf vor 22 Uhr deutscher Zeit wird übersprungen.
    - cron: "4 20 * * 1-5"    # Sommerzeit: 22:04 Uhr
    - cron: "4 21 * * 1-5"    # Winterzeit: 22:04 Uhr
    # Voll-Lauf mit neu gerechnetem Backtest (gleicher Börsentag, Aufgaben bleiben gleich)
    - cron: "47 22 * * 1-5"
  workflow_dispatch:
    inputs:
      modus:
        description: "schnell = Backtest vom Vortag übernehmen, voll = alles neu rechnen"
        default: "voll"
        type: choice
        options: [voll, schnell]
  push:
    paths: ["watchlist.csv"]   # Watchlist geändert -> sofort neu analysieren

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Modus bestimmen
        id: modus
        run: |
          STUNDE=$(TZ=Europe/Berlin date +%H)
          MODUS="voll"; LOS="ja"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" != "47 22 * * 1-5" ]; then
              MODUS="schnell"
              # Der Sommer-/Winterzeit-Zwilling, der vor 22 Uhr deutscher Zeit startet, wird übersprungen
              if [ "$STUNDE" -lt 22 ] && [ "$STUNDE" -ge 12 ]; then LOS="nein"; fi
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.modus }}" = "schnell" ]; then
            MODUS="schnell"
          fi
          echo "modus=$MODUS" >> "$GITHUB_OUTPUT"; echo "los=$LOS" >> "$GITHUB_OUTPUT"
          echo "Berlin $(TZ=Europe/Berlin date '+%H:%M') – Modus $MODUS – Start $LOS"
      - uses: actions/checkout@v4
        if: steps.modus.outputs.los == 'ja'
      - uses: actions/setup-python@v5
        if: steps.modus.outputs.los == 'ja'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.modus.outputs.los == 'ja'
      - run: python -m analyzer.run
        if: steps.modus.outputs.los == 'ja'
        env:
          BACKTEST_MODUS: ${{ steps.modus.outputs.modus }}
      - name: Ergebnisse speichern
        if: steps.modus.outputs.los == 'ja'
        run: |
          git config user.name "elliott-bot"
          git config user.email "elliott-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Analyse $(date -u +%Y-%m-%d) (${{ steps.modus.outputs.modus }})"
          git pull --rebase -X theirs || true
          git push
