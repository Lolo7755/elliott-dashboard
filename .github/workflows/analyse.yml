name: Elliott-Analyse

on:
  schedule:
    # Mo–Fr 22:17 Uhr deutscher Winterzeit (21:17 UTC), kurz nach US-Börsenschluss (22:00 Uhr).
    # Ergebnis steht nach ca. 10–12 Minuten, also gegen 22:30 Uhr.
    # Zweiter Lauf um 23:47 Uhr als Absicherung, falls GitHub den ersten verspätet oder auslässt.
    - cron: "17 21 * * 1-5"
    - cron: "47 22 * * 1-5"
  workflow_dispatch: {}        # Button "Run workflow" = Analyse sofort starten
  push:
    paths: ["watchlist.csv"]   # Watchlist geändert -> sofort neu analysieren

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m analyzer.run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Ergebnisse speichern
        run: |
          git config user.name "elliott-bot"
          git config user.email "elliott-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Analyse $(date -u +%Y-%m-%d)"
          git push
